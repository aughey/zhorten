[workspace]
members = [
  "crates/zhorten-app",
  "crates/zhorten-core",
  "crates/zhorten-service",
  "crates/zhorten-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zhorten-core = { path = "crates/zhorten-core" }
zhorten-service = { path = "crates/zhorten-service" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
