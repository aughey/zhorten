[workspace]
members = [
  "crates/zhorten-app",
  "crates/zhorten-core",
  "crates/zhorten-google",
  "crates/zhorten-cli",
  "crates/zhorten-database",
  "crates/zhorten-service",
  "crates/zhorten-server",
  "crates/zhorten-sled",
  "crates/zhorten-sqlite",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
zhorten-core = { path = "crates/zhorten-core" }
zhorten-database = { path = "crates/zhorten-database" }
zhorten-service = { path = "crates/zhorten-service" }
zhorten-sled = { path = "crates/zhorten-sled" }
zhorten-sqlite = { path = "crates/zhorten-sqlite" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
